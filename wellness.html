<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
    <title>Spa & Wellness Area Audit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @media print {
            body { background-color: white !important; font-size: 11px !important; }
            .no-print { display: none !important; }
            .print-photo { width: 12rem !important; height: 12rem !important; }
            * { -webkit-print-color-adjust: exact !important; }
        }
        .status-btn.selected-compliant { background-color: #10b981; color: white; }
        .status-btn.selected-non-compliant { background-color: #ef4444; color: white; }
        .status-btn.selected-na { background-color: #64748b; color: white; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="editor-view" class="max-w-5xl mx-auto p-4 print:p-0">
        <div id="checklist-container" class="divide-y divide-slate-100 bg-white rounded-xl border border-slate-200">
        </div>
    </div>

    <script>
        const AUDIT_QUESTIONS = [
            "[Reception] Reception desk is clean and organized.",
            "[Saloon] Maintenance: Please highlight with photos any areas that require maintenance attention."
        ];

        const app = {
            reports: [],
            currentReportId: null,

            compressImage(file, callback) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_SIZE = 1024; 
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                        } else {
                            if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        const now = new Date();
                        const timestampStr = now.toLocaleString();
                        ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
                        ctx.fillRect(width - 200, height - 40, 200, 40);
                        ctx.fillStyle = "#ffffff";
                        ctx.font = "bold 16px sans-serif";
                        ctx.fillText(timestampStr, width - 190, height - 15);
                        
                        callback(canvas.toDataURL('image/jpeg', 0.65)); 
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            },

            renderChecklist() {
                const container = document.getElementById('checklist-container');
                container.innerHTML = '';
                AUDIT_QUESTIONS.forEach((q, index) => {
                    const row = document.createElement('div');
                    row.className = "p-6";
                    row.innerHTML = `<div>${q}</div>
                        <div class="flex gap-2 mt-2">
                            <!-- Photo thumbnails -->
                            <div class="relative w-24 h-24 sm:w-32 sm:h-32 rounded-lg border-2 border-slate-200 overflow-hidden print:w-48 print:h-48 print-photo">
                                <img src="" class="w-full h-full object-cover">
                            </div>
                        </div>`;
                    container.appendChild(row);
                });
            }
        };

        window.onload = () => app.renderChecklist();
    </script>
</body>
</html>
